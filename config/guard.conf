# A1-内存管理 [HyperOS4] 守护进程配置
# 修改保存后守护进程会自动热重载, 无需重启
#
# enable              总开关 (1/0)
# poll_ms             游戏在后台时轮询间隔, 毫秒 (>=500)
# idle_poll_ms        无游戏时的检查间隔, 毫秒 (>=1000)
# protect_minutes     切出游戏后的保护时长, 分钟
# pin_adj_main        游戏主进程锁定的 oom_score_adj (0=前台级)
# pin_adj_child       游戏子进程锁定的 oom_score_adj
# cleanup             内存压力大时清理无关缓存应用 (1/0)
# psi_threshold       PSI avg60 压力阈值(%), 超过才清理
# cleanup_interval_ms 压力检查间隔, 毫秒
# cleanup_cooldown_ms 两次清理之间的冷却, 毫秒
# cleanup_max_kill    单次最多清理的进程数
# log                 日志开关 (1/0)
# log_path            日志路径

enable=1
poll_ms=2000
idle_poll_ms=5000
protect_minutes=30
pin_adj_main=0
pin_adj_child=200
cleanup=1
psi_threshold=40.0
cleanup_interval_ms=15000
cleanup_cooldown_ms=60000
cleanup_max_kill=8
log=1
log_path=/data/local/tmp/a1guard.log
